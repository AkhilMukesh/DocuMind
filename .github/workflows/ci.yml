
name: DocuMind CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documind-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Lint Python code
        run: ruff check src tests --select E9,F63,F7,F82

      - name: Run automated tests
        env:
          GROQ_API_KEY: ci-placeholder-not-a-real-key
        run: python -m pytest -q

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build DocuMind image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: documind-ai:${{ github.sha }}
